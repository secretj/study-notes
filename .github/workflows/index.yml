# 글이 바뀌면 index.json 과 README.md 목차를 다시 만든다.
name: index
on:
  push:
    branches: [main]
    paths: ["**.md", "!README.md", "tools/build_index.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: index
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py .
      - name: commit if changed
        run: |
          if git diff --quiet -- index.json README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          git commit -m "목차 갱신 (index.json, README)"
          git pull --rebase origin main
          git push
